<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        .image-header {
            text-align: center;
            padding-bottom: 20px;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div style="background-color: #f9f9f9; margin: 50px auto 20px auto; box-shadow: 3px 4px 15px 0 lightgray; border-radius: 5px; max-width: 650px;">
        <!-- Body -->
        <div style="margin: 0px auto; max-width: 640px; border-radius: 4px; padding: 10px 30px 30px 30px;">
            <div style="margin: 0px auto; max-width: 640px; ">
                <h2 style="text-align: center;">Resetting your password?</h2>
                <!-- <h2 style="font-weight: 500; font-size: 20px; color: #4f545c; letter-spacing: 0.27px;"> Hey {{username}},</h2> -->
                <!-- <p style="color:#737f8d;font-family:Helvetica Neue,Helvetica,Arial,Lucida Grande,sans-serif;font-size:16px;line-height:24px;text-align:left">Your password can be reset by clicking the button below. If you did not request a new password, please ignore this email.</p> -->

                <p style="color:#737f8d;font-family:Helvetica Neue,Helvetica,Arial,Lucida Grande,sans-serif;font-size:16px;line-height:24px;text-align:center">Hey {{username}}, Your password can be reset by clicking the button below. If you did not request a new password, please ignore this email.</p>

                <div style="text-align: center; padding: 20px 0;">
                    <a href="{{callbackURI}}" style="background-color: #0073e6; color: #ffffff; border: none; border-radius: 8px; padding: 15px 40px; cursor: pointer; text-decoration: none; ">Reset my password</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Footer -->
    <div style="margin: 0px auto; max-width: 640px; background: transparent;">
        <div style="text-align: center;">
            <p style="font-size: 1=2px; text-align: center; color: #aeaeae;">This is an automated message, please do not reply.</p>
        </div>
    </div>
</body>

</html>
