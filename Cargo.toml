[package]
name = "api_starter"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "API Starter backend IAM service (auth, users, permissions)"
publish = false

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# http server
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "trace",
    "request-id",
    "util",
    "cors",
    "normalize-path",
    "sensitive-headers",
] }

# tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# persistence
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

# domain helpers
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }

# security
jsonwebtoken = "9"
bcrypt = "0.17"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"

# mail
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1",
] }

# misc
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
dotenvy = "0.15"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
